<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geocache Stage 5: 宝箱のレトロスロット</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
        }
        h1 { font-size: 17px; color: #f39c12; margin-bottom: 3px; }
        p { font-size: 11px; color: #ccc; margin-top: 0; margin-bottom: 10px; }
        
        #game-container {
            background-color: #3e2723;
            border: 4px solid #5d4037;
            border-radius: 10px;
            padding: 15px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }

        .chest-title {
            font-size: 14px;
            color: #f1c40f;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .slot-machine {
            display: flex;
            justify-content: center;
            gap: 6px;
            background-color: #111;
            border: 4px inset #444;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        /* 視認性改善：背景を黒、文字をゴールドにして見やすくする */
        .reel {
            width: 70px;
            height: 75px;
            background-color: #000;
            border: 2px solid #7f8c8d;
            border-radius: 4px;
            font-size: 22px; /* BARなどがはみ出さないようにサイズ調整 */
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1c40f; 
        }

        .action-btn {
            background-color: #f39c12;
            color: #111;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            font-family: inherit;
        }
        .action-btn:active {
            transform: translateY(2px);
            background-color: #d68910;
        }
        .action-btn:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            margin-top: 8px;
            padding: 10px;
            background: #2b2b2b;
            border: 2px solid #f39c12;
            border-radius: 6px;
            display: inline-block;
        }
        #message.hidden { 
            display: none !important; 
        }
        .success { color: #2ecc71; font-weight: bold; font-size: 13px; }
        
        .retry-btn {
            margin-top: 6px;
            background-color: #f39c12;
            color: #111;
            border: none;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <h1>Stage 5: 宝箱のレトロスロット</h1>
    <p>宝箱を開けろ！「7 7 7」が揃えば大当り！</p>

    <div id="game-container">
        <div class="chest-title">📦 宝箱の内部スロット 📦</div>
        
        <div class="slot-machine">
            <div id="reel1" class="reel">7</div>
            <div id="reel2" class="reel">7</div>
            <div id="reel3" class="reel">7</div>
        </div>

        <button id="spinBtn" class="action-btn" onclick="startSpin()">回転スタート！</button>
    </div>

    <div id="message" class="hidden">
        <p class="success">🎉 宝箱が開いた！大当り！</p>
        <p>次の座標: <b>N 36° XX.XXX E 139° XX.XXX</b></p>
        <p>キーワード: <b>[ SLOT_TREASURE ]</b></p>
        <button class="retry-btn" onclick="resetGame()">もう一度プレイする（答えを隠す）</button>
    </div>

    <script>
        // ==========================================
        // 🎛️ 【確率調整エリア】当たりやすさの設定 (1〜100)
        // ==========================================
        const WIN_PROBABILITY = 15; 
        // ==========================================

        const symbols = ['7', '🍉', '🔔', '🍒', '🍇', '🍊', 'BAR'];

        let spinning = false;
        let timer1, timer2, timer3;

        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reel3 = document.getElementById('reel3');
        const spinBtn = document.getElementById('spinBtn');
        const messageBox = document.getElementById('message');

        function startSpin() {
            if (spinning) return;
            spinning = true;
            spinBtn.disabled = true;
            messageBox.classList.add('hidden');

            timer1 = setInterval(() => { reel1.innerText = symbols[Math.floor(Math.random() * symbols.length)]; }, 60);
            timer2 = setInterval(() => { reel2.innerText = symbols[Math.floor(Math.random() * symbols.length)]; }, 60);
            timer3 = setInterval(() => { reel3.innerText = symbols[Math.floor(Math.random() * symbols.length)]; }, 60);

            setTimeout(() => { stopReels(); }, 2500);
        }

        function stopReels() {
            const isWin = Math.floor(Math.random() * 100) < WIN_PROBABILITY;

            clearInterval(timer1);
            reel1.innerText = isWin ? '7' : symbols[Math.floor(Math.random() * (symbols.length - 1)) + 1];

            setTimeout(() => {
                clearInterval(timer2);
                reel2.innerText = isWin ? '7' : symbols[Math.floor(Math.random() * (symbols.length - 1)) + 1];

                setTimeout(() => {
                    clearInterval(timer3);
                    reel3.innerText = isWin ? '7' : symbols[Math.floor(Math.random() * (symbols.length - 1)) + 1];

                    spinning = false;
                    spinBtn.disabled = false;

                    if (reel1.innerText === '7' && reel2.innerText === '7' && reel3.innerText === '7') {
                        messageBox.classList.remove('hidden');
                    }
                }, 500);
            }, 500);
        }

        function resetGame() {
            if (spinning) return;
            messageBox.classList.add('hidden');
            reel1.innerText = '7';
            reel2.innerText = '7';
            reel3.innerText = '7';
        }
    </script>
</body>
</html>
